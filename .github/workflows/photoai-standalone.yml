name: PhotoAI packaged app validation
on:
  push:
    branches: [ci/macos-v07184]
    paths: ['.github/workflows/photoai-standalone.yml', 'ci/standalone_smoke.py']
permissions:
  contents: read
  actions: read
jobs:
  standalone:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: photoai-v07184-macos-arm64-results
          run-id: 41025441660
          github-token: ${{ github.token }}
          path: validated-build
      - name: Unpack previously validated app
        run: |
          mkdir -p results
          ditto -x -k validated-build/PhotoAI-Retouch-Validation-Mac-ARM64.zip results
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run packaged app import edit undo export checks
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/pip install Pillow==11.3.0 scikit-image==0.25.2
          .smoke-venv/bin/python ci/standalone_smoke.py results/PhotoAI-Retouch-Validation.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photoai-standalone-evidence
          path: results/smoke/
          retention-days: 14
